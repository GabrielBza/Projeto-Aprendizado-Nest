services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist/frontend/browser:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true
    name: projeto-aprendizado-network
