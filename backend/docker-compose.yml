services:
  backend:
    build:
      context: .

    container_name: nest-backend

    ports:
      - '3000:3000'

    volumes:
      - .:/app
      - node_modules_backend:/app/node_modules

    command: npm run start:dev

    networks:
      - backend-network

volumes:
  node_modules_backend:

networks:
  backend-network:
    external: true
    name: projeto-aprendizado-network
