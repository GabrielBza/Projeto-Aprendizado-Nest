<div class="overlay">
  <div class="popup">
    <h2>{{ titulo }}</h2>

    <p>{{ mensagem }}</p>

    <div class="acoes">
      <app-botao texto="Cancelar" tipo="secundario" (clicado)="aoCancelar()"></app-botao>

      <app-botao
        [texto]="textoConfirmar"
        [tipo]="tipoConfirmar"
        (clicado)="aoConfirmar()"
      ></app-botao>
    </div>
  </div>
</div>
