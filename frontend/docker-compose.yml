services:
  frontend:
    build:
      context: .

    container_name: angular-frontend

    ports:
      - '4200:4200'

    volumes:
      - .:/app
      - node_modules_frontend:/app/node_modules

    command: npm run start -- --host 0.0.0.0

    networks:
      - frontend-network

volumes:
  node_modules_frontend:

networks:
  frontend-network:
    external: true
    name: projeto-aprendizado-network
